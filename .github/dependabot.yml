version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Qyzylorda
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    groups:
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Qyzylorda
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - security
